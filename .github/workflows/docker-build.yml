name: Build & Push Backend Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"          # e.g. v1.0.0 → tagged release
  pull_request:
    branches:
      - main              # build-only on PRs (no push)
  workflow_dispatch:      # manual trigger from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/b2  # → ghcr.io/AnkitM1410/b2

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest

    # Needed for GHCR push and attestations
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up QEMU (multi-arch: linux/amd64 + linux/arm64) ──
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── 3. Set up Docker Buildx ────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Log in to GHCR (skip on PRs) ───────────────────
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Extract metadata (tags + labels) ────────────────
      #   Produces tags like:
      #     • ghcr.io/AnkitM1410/b2:main          (branch push)
      #     • ghcr.io/AnkitM1410/b2:v1.2.3        (tag push)
      #     • ghcr.io/AnkitM1410/b2:latest         (tag push)
      #     • ghcr.io/AnkitM1410/b2:sha-<short>   (always)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # ── 6. Build (and push on non-PR events) ──────────────
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer caching via GitHub Actions cache backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 7. Attest build provenance (supply-chain security) ─
      - name: Attest image provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ── 8. Print image digest for easy reference ───────────
      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Pushed → ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
